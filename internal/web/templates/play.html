{{define "title"}}{{.Data.Name}}{{end}}
{{define "scripts"}}{{if .Data.Config}}<script src="{{asset "hls-1.7.3.light.min.js"}}" defer></script>
<script src="{{asset "player.js"}}" defer></script>{{end}}{{end}}
{{define "content"}}
<div class="playerpage">
	<p class="note"><a href="{{.Data.Back}}">← {{.Data.Name}}</a></p>
	{{if .Data.Config}}
	<div id="player" data-config="{{.Data.Config}}">{{template "player" .}}</div>
	{{else}}
	<p class="flash err">{{t .Data.Play.Reason}} ({{.Data.Play.Detail}})</p>
	{{end}}
</div>
{{end}}
