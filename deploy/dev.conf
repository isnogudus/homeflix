# Configuration used by scripts/deploy-dev.sh on the development host.
movies = "/export/movies"

server name "homeflix-dev"
listen on * port 8096
data directory "data"
log level debug
language de

ffprobe "/usr/local/bin/ffprobe"
ffmpeg "/usr/local/bin/ffmpeg"

library "Filme" {
	path $movies/plex
	path $movies/archiv
}
